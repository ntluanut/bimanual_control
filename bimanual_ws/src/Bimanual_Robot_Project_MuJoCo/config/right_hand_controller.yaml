right_hand_controller:
  type: position_controllers/JointTrajectoryController
  joints:
    - ffj0
    - ffj1
    - ffj2
    - ffj3
    - mfj0
    - mfj1
    - mfj2
    - mfj3
    - rfj0
    - rfj1
    - rfj2
    - rfj3
    - thj0
    - thj1
    - thj2
    - thj3
  constraints:
    goal_time: 2.0
    stopped_velocity_tolerance: 0.01
    ffj0: {trajectory: 0, goal: 0.2}
    ffj1: {trajectory: 0, goal: 0.2}
    ffj2: {trajectory: 0, goal: 0.2}
    ffj3: {trajectory: 0, goal: 0.2}
    mfj0: {trajectory: 0, goal: 0.2}
    mfj1: {trajectory: 0, goal: 0.2}
    mfj2: {trajectory: 0, goal: 0.2}
    mfj3: {trajectory: 0, goal: 0.2}
    rfj0: {trajectory: 0, goal: 0.2}
    rfj1: {trajectory: 0, goal: 0.2}
    rfj2: {trajectory: 0, goal: 0.2}
    rfj3: {trajectory: 0, goal: 0.2}
    thj0: {trajectory: 0, goal: 0.2}
    thj1: {trajectory: 0, goal: 0.2}
    thj2: {trajectory: 0, goal: 0.2}
    thj3: {trajectory: 0, goal: 0.2}